name: Build WFE Brasil OFM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-brazil-ofm.yml"
      - "scripts/generate_brazil_fase1.py"

jobs:
  build-ofm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout OpenFoot Manager
        uses: actions/checkout@v4
        with:
          repository: openfootmanager/openfootmanager
          ref: 8f6659f5022edcb80529661b0d4d416430c9b6b9
          path: upstream

      - name: Generate Brazil package source
        run: python3 scripts/generate_brazil_fase1.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate package with official ofm-cli
        run: cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- validate wfe-brasil-fase1

      - name: Pack with official ofm-cli
        run: cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- pack wfe-brasil-fase1 --output WFE_BRASIL_2026_FASE1.ofm

      - name: Verify packed OFM
        run: cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- info WFE_BRASIL_2026_FASE1.ofm

      - name: Upload WFE OFM
        uses: actions/upload-artifact@v4
        with:
          name: WFE-Brasil-2026-Fase1
          path: WFE_BRASIL_2026_FASE1.ofm
          if-no-files-found: error
          retention-days: 14
