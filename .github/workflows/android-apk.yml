name: Build WFE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/prepare_cm.py"
      - "scripts/generate_brazil_fase1.py"
      - "overrides/**"
      - "README.md"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout WFE build repo
        uses: actions/checkout@v4

      - name: Checkout OpenFoot Manager base
        uses: actions/checkout@v4
        with:
          repository: openfootmanager/openfootmanager
          ref: 8f6659f5022edcb80529661b0d4d416430c9b6b9
          path: upstream

      - name: Prepare WFE customizations
        run: python3 scripts/prepare_cm.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install frontend dependencies
        working-directory: upstream
        run: npm ci

      - name: Frontend QA (TypeScript + Vite)
        working-directory: upstream
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Generate embedded WFE Brasil database
        shell: bash
        run: |
          python3 scripts/generate_brazil_fase1.py
          cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- validate wfe-brasil-fase1
          mkdir -p upstream/src-tauri/resources
          cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- pack wfe-brasil-fase1 --output upstream/src-tauri/resources/wfe-brasil-2026-fase1.ofm
          cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- info upstream/src-tauri/resources/wfe-brasil-2026-fase1.ofm

      - name: Generate WFE app icons
        working-directory: upstream
        run: npm run tauri icon public/wfe-app-icon.svg

      - name: Initialize Tauri Android project
        working-directory: upstream
        run: npm run tauri android init

      - name: Enable Android immersive fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matches = list(Path("upstream/src-tauri/gen/android").rglob("MainActivity.kt"))
          if not matches:
              raise SystemExit("MainActivity.kt not found after tauri android init")

          path = matches[0]
          src = path.read_text(encoding="utf-8")

          if "enableImmersiveMode" not in src:
              imports = """import android.os.Build
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          """
              package_line_end = src.find("\n", src.find("package "))
              if package_line_end < 0:
                  raise SystemExit("Android package declaration not found")
              src = src[: package_line_end + 1] + "\n" + imports + src[package_line_end + 1 :]

              class_marker = "class MainActivity : TauriActivity() {"
              if class_marker not in src:
                  raise SystemExit("MainActivity class marker not found")
              src = src.replace(
                  class_marker,
                  class_marker + "\n  override val handleBackNavigation: Boolean = true",
                  1,
              )

              on_create_marker = "    super.onCreate(savedInstanceState)\n"
              if on_create_marker not in src:
                  raise SystemExit("MainActivity onCreate marker not found")
              src = src.replace(
                  on_create_marker,
                  on_create_marker + "    enableImmersiveMode()\n",
                  1,
              )

              immersive_methods = """
          
            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) enableImmersiveMode()
            }

            private fun enableImmersiveMode() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                window.setDecorFitsSystemWindows(false)
                window.insetsController?.let { controller ->
                  controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  controller.systemBarsBehavior =
                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                }
              } else {
                @Suppress("DEPRECATION")
                window.decorView.systemUiVisibility =
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                    View.SYSTEM_UI_FLAG_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }
            }
          """
              final_brace = src.rfind("}")
              if final_brace < 0:
                  raise SystemExit("MainActivity closing brace not found")
              src = src[:final_brace] + immersive_methods + "\n" + src[final_brace:]

          path.write_text(src, encoding="utf-8")
          print("Immersive fullscreen enabled in", path)
          PY

      - name: Build APK ARM64
        working-directory: upstream
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          echo "Generated APK files:"
          find upstream/src-tauri/gen/android -type f -name "*.apk" -print
          APK_DIR="$(find upstream/src-tauri/gen/android -type f -name "*.apk" -printf '%h\n' | head -n 1)"
          if [ -z "$APK_DIR" ]; then
            echo "No APK generated."
            exit 1
          fi
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload WFE APK
        uses: actions/upload-artifact@v4
        with:
          name: WFE-Android-APK
          path: ${{ steps.apk.outputs.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 14
