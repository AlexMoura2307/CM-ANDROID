name: Build CM Android APK

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      south_america_run_id:
        description: "Successful Build CM South America OFM run id"
        required: true
        type: string
  workflow_run:
    workflows: ["Build CM South America OFM", "Merge CM South America OFM"]
    types: [completed]

concurrency:
  group: cm-final-android-teste4
  cancel-in-progress: true

jobs:
  build-android:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout WFE build repo
        uses: actions/checkout@v4

      - name: Checkout OpenFoot Manager base
        uses: actions/checkout@v4
        with:
          repository: openfootmanager/openfootmanager
          ref: 8f6659f5022edcb80529661b0d4d416430c9b6b9
          path: upstream

      - name: Download consolidated South America OFM
        uses: actions/download-artifact@v4
        with:
          name: CM-South-America-2026
          path: final-data
          run-id: ${{ github.event.workflow_run.id || inputs.south_america_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CM customizations
        run: |
          python3 scripts/prepare_cm.py
          python3 scripts/prepare_cm_south_america.py
          mkdir -p upstream/src-tauri/resources
          cp final-data/CM_SOUTH_AMERICA_2026.ofm upstream/src-tauri/resources/cm-south-america-2026.ofm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install frontend dependencies
        working-directory: upstream
        run: npm ci

      - name: Frontend QA (TypeScript + Vite)
        working-directory: upstream
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify embedded South America database
        run: cargo run --manifest-path upstream/src-tauri/Cargo.toml -p ofm-cli -- info upstream/src-tauri/resources/cm-south-america-2026.ofm

      - name: Generate CM app icons
        working-directory: upstream
        run: npm run tauri icon public/cm-app-icon.svg

      - name: Initialize Tauri Android project
        working-directory: upstream
        run: npm run tauri android init

      - name: Enable Android immersive fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matches = list(Path("upstream/src-tauri/gen/android").rglob("MainActivity.kt"))
          if not matches:
              raise SystemExit("MainActivity.kt not found after tauri android init")

          path = matches[0]
          src = path.read_text(encoding="utf-8")

          if "enableImmersiveMode" not in src:
              imports = """import android.os.Build
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          """
              package_line_end = src.find("\n", src.find("package "))
              if package_line_end < 0:
                  raise SystemExit("Android package declaration not found")
              src = src[: package_line_end + 1] + "\n" + imports + src[package_line_end + 1 :]

              class_marker = "class MainActivity : TauriActivity() {"
              if class_marker not in src:
                  raise SystemExit("MainActivity class marker not found")
              src = src.replace(
                  class_marker,
                  class_marker + "\n  override val handleBackNavigation: Boolean = true",
                  1,
              )

              on_create_marker = "    super.onCreate(savedInstanceState)\n"
              if on_create_marker not in src:
                  raise SystemExit("MainActivity onCreate marker not found")
              src = src.replace(
                  on_create_marker,
                  on_create_marker + "    enableImmersiveMode()\n",
                  1,
              )

              immersive_methods = """
          
            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) enableImmersiveMode()
            }

            private fun enableImmersiveMode() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                window.setDecorFitsSystemWindows(false)
                window.insetsController?.let { controller ->
                  controller.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  controller.systemBarsBehavior =
                    WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                }
              } else {
                @Suppress("DEPRECATION")
                window.decorView.systemUiVisibility =
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                    View.SYSTEM_UI_FLAG_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                    View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                    View.SYSTEM_UI_FLAG_LAYOUT_STABLE
              }
            }
          """
              final_brace = src.rfind("}")
              if final_brace < 0:
                  raise SystemExit("MainActivity closing brace not found")
              src = src[:final_brace] + immersive_methods + "\n" + src[final_brace:]

          path.write_text(src, encoding="utf-8")
          print("Immersive fullscreen enabled in", path)
          PY

      - name: Build APK ARM64
        working-directory: upstream
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          echo "Generated APK files:"
          find upstream/src-tauri/gen/android -type f -name "*.apk" -print
          APK_DIR="$(find upstream/src-tauri/gen/android -type f -name "*.apk" -printf '%h\n' | head -n 1)"
          if [ -z "$APK_DIR" ]; then
            echo "No APK generated."
            exit 1
          fi
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify APK identity and size
        shell: bash
        run: |
          APK_FILE="$(find upstream/src-tauri/gen/android -type f -name "*.apk" | head -n 1)"
          test -n "$APK_FILE"
          test "$(stat -c%s "$APK_FILE")" -gt 5000000
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FILE" | tee /tmp/cm-apk-badging.txt
          grep -q "package: name='com.cm.clubemanager.test4'" /tmp/cm-apk-badging.txt
          cp "$APK_FILE" /tmp/CM_Teste_4_ARM64.apk

      - name: Upload CM Teste 4 APK
        uses: actions/upload-artifact@v4
        with:
          name: CM-Teste-4-Android-APK
          path: /tmp/CM_Teste_4_ARM64.apk
          if-no-files-found: error
          retention-days: 14
