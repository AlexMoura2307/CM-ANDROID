name: QA CM Full South America Save

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
    paths:
      - "scripts/prepare_cm_south_america.py"
      - ".github/workflows/cm-full-save-qa.yml"
  workflow_dispatch:

jobs:
  full-save-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout CM repo
        uses: actions/checkout@v4

      - name: Checkout OpenFoot Manager base
        uses: actions/checkout@v4
        with:
          repository: openfootmanager/openfootmanager
          ref: 8f6659f5022edcb80529661b0d4d416430c9b6b9
          path: upstream

      - name: Download approved South America package
        uses: actions/download-artifact@v4
        with:
          name: CM-South-America-2026
          path: final-data
          run-id: 37376740334
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply CM patches
        run: |
          python3 scripts/prepare_cm.py
          python3 scripts/prepare_cm_south_america.py
          mkdir -p upstream/src-tauri/resources
          cp final-data/CM_SOUTH_AMERICA_2026.ofm upstream/src-tauri/resources/cm-south-america-2026.ofm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run full save round-trip
        env:
          CM_TEST_OFM_PATH: ${{ github.workspace }}/final-data/CM_SOUTH_AMERICA_2026.ofm
          RUST_LOG: info
        run: |
          cargo test --manifest-path upstream/src-tauri/Cargo.toml -p openfootmanager cm_south_america_full_save_roundtrip -- --nocapture
