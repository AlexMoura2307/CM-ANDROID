name: QA CM Online

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "online-server/**"
      - ".github/workflows/online-server-qa.yml"

jobs:
  online-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: online-server
        run: npm install --no-audit --no-fund
      - name: Run multiplayer permission tests
        working-directory: online-server
        run: npm test
